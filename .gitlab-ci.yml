stages:
  - lint
  - test
  - security

default:
  image: python:3.12-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  key: pip-$CI_COMMIT_REF_SLUG
  paths:
    - .cache/pip

ruff:
  stage: lint
  script:
    - pip install "ruff==0.17.3"
    - ruff check .
    - ruff format --check .

pytest:
  stage: test
  script:
    - pip install -e ".[dev]"
    - pytest --junitxml=report.xml --cov=agent --cov-report=term --cov-report=xml:coverage.xml
    # Trivy can't resolve dependencies from a bare pyproject.toml, so hand it the
    # exact set installed here.
    - pip freeze --exclude-editable > requirements-frozen.txt
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    paths:
      - requirements-frozen.txt
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

trivy:
  stage: security
  needs: [pytest]
  image:
    # 0.76.1 (latest stable as of 2026-10-27), pinned to its multi-arch index digest.
    # Bump deliberately: look up the new tag's digest on Docker Hub and replace both.
    name: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SKIP_DIRS: ".cache,.trivycache"
  cache:
    key: trivy
    paths:
      - .trivycache
  script:
    - trivy fs --scanners vuln,secret,misconfig --format json --output trivy-report.json .
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
  artifacts:
    when: always
    paths:
      - trivy-report.json
